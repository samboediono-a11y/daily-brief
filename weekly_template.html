<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weekly Rewind — Week of {{WEEK_OF}}</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0E11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11;
    --bg-raised:#12161B;
    --card:#161B21;
    --card-hi:#1B2129;
    --line:#252C35;
    --text:#EDF0F2;
    --text-dim:#8F98A3;
    --text-faint:#5B6470;
    --teal:#2DD4BF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 400px at 50% -80px, rgba(45,212,191,0.10), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  .tabs-wrap{
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .tabs-wrap::-webkit-scrollbar{ height:0; }
  .tabs{
    display:flex;
    max-width:820px;
    margin:0 auto;
    padding:8px 20px 0;
    gap:4px;
  }
  .tab{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.03em;
    color:var(--text-faint);
    padding:9px 14px;
    border-radius:8px 8px 0 0;
    white-space:nowrap;
    flex-shrink:0;
    border:1px solid transparent;
    border-bottom:none;
  }
  .tab.active{ color:var(--teal); background:var(--bg); border-color:var(--line); }

  header{
    max-width:820px;
    margin:0 auto;
    padding:38px 20px 26px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-faint);
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
  }
  h1.masthead{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:38px;
    line-height:1.05;
    margin:0 0 12px;
    letter-spacing:-0.01em;
    background:linear-gradient(180deg, #FFFFFF 0%, #C9D0D6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .dateline{ font-size:13.5px; color:var(--text-dim); }
  .back-link{
    display:inline-block;
    margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--teal);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px;
  }

  main{ max-width:820px; margin:0 auto; padding:10px 20px 60px; }

  .theme-card{
    background:linear-gradient(180deg, var(--card-hi), var(--card));
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:0 10px 28px -18px rgba(0,0,0,0.6);
  }
  .theme-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 12px;
    color:var(--text);
  }
  .theme-synth{
    font-size:14.5px;
    line-height:1.65;
    color:#C7CDD3;
    margin:0 0 14px;
  }
  .theme-watch{
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13.5px;
    color:#D3D9DE;
    margin:0;
  }
  .watch-label{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:11px;
    color:var(--teal);
  }
  .themes-empty{
    font-size:13.5px;
    color:var(--text-faint);
    padding:20px 0;
  }

  footer{
    max-width:820px;
    margin:0 auto;
    padding:30px 20px 60px;
    border-top:1px solid var(--line);
  }
  footer p{ font-size:12.5px; line-height:1.6; color:var(--text-faint); margin:0; }

  @media (max-width:600px){
    h1.masthead{ font-size:29px; }
    .theme-title{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="tabs-wrap">
  <!-- WEEK_TABS_START -->
  <div class="tabs">
{{WEEK_TABS}}
  </div>
  <!-- WEEK_TABS_END -->
</div>

<header>
  <div class="eyebrow"><span>Weekly Edition</span><span>Auto-generated</span></div>
  <h1 class="masthead">The Weekly Rewind</h1>
  <div class="dateline">Week of {{WEEK_OF}}</div>
  <a class="back-link" href="index.html">&larr; Back to today's Daily Brief</a>
</header>

<main>
{{THEMES}}
</main>

<footer>
  <p>Synthesized from the past 7 daily editions using Google's Gemini free API. Same analyst voice as the daily brief, zoomed out to the week's biggest patterns.</p>
</footer>

</body>
</html>
