name: Daily Brief

on:
  schedule:
    # GitHub Actions schedules are "best-effort" - they can be delayed or,
    # occasionally, silently skipped entirely (especially during periods of
    # high platform load). This is a documented GitHub limitation, not
    # something fixable in this repo's code. Two mitigations here:
    #   1. A backup run 30 minutes later, so a skipped first attempt still
    #      has a second chance the same morning.
    #   2. The `timezone:` field (added by GitHub in March 2026) pins this
    #      to Pacific time directly and handles daylight saving
    #      automatically - no more manual UTC-offset math or DST drift.
    - cron: "0 7 * * *"
      timezone: "America/Los_Angeles"
    - cron: "30 7 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: {}   # lets you also run it manually from the Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out existing site (so the archive persists)
        uses: actions/checkout@v4
        continue-on-error: true  # first-ever run: gh-pages doesn't exist yet, that's fine
        with:
          ref: gh-pages
          path: existing-site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_brief.py

      - name: Publish to the website (GitHub Pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: true
